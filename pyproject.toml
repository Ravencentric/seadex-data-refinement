[project]
name = "seadex-data-refinement"
version = "0.1.0"
description = "Generate static statistics pages from SeaDex data."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ravencentric", email = "me@ravencentric.cc" }]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.4",
    "pyanilist>=0.9.0",
    "seadex>=0.7.2",
    "tqdm>=4.69.0",
    "zensical>=0.0.51",
]

[project.scripts]
sdr = "seadex_data_refinement.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.9.9",
    "types-tqdm>=4.69.0.20260720",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "RUF", "UP", "N"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
strict = true
pretty = true
files = ["src/**/*.py"]
enable_error_code = ["ignore-without-code"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
