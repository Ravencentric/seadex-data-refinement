[project]
name = "sdr"
version = "0.1.0"
description = "SeaDex statistics and reports highlighting entries that need attention."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ravencentric", email = "me@ravencentri.cc" }
]
requires-python = ">=3.14"
dependencies = [
    "atomicwriter>=0.3.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "msgspec>=0.22.0",
    "pyanilist>=0.9.0",
    "seadex>=0.7.3",
    "stamina>=26.1.0",
    "zensical>=0.0.73",
]

[project.scripts]
sdr = "sdr.__main__:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pyrefly]
preset = "all"
python-platform = "all"
project-includes = [
  "src/**/*.py",
]

[tool.pyrefly.errors]
explicit-any = false
implicit-bool = false
unused-call-result = false

[tool.ruff]
line-length = 120

