name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *" # Daily at 00:17 UTC

permissions: {}

env:
  UV_LOCKED: "1"
  UV_NO_DEV: "1"
  FORCE_COLOR: "1"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Replace the page-history release
      pages: read # Read the site's Pages configuration
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Fetch entries and page history
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run sdr fetch

      - name: Build the site
        run: uv run --offline sdr build

      - name: Replace page history release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --offline sdr publish

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: site

  deploy:
    name: Deploy the site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write # Publish the uploaded site
      id-token: write # Prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
