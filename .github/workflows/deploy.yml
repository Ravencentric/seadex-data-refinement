name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'templates/**'
      - 'zensical.toml'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  FORCE_COLOR: 1
  UV_LOCKED: 1
  UV_PYTHON: '3.13'

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate Markdown reports
        run: uv run sdr docs

      - name: Install Zensical
        run: pipx install zensical

      - name: Build site
        run: zensical build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
